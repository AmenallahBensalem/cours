
name: cours-test

services:
  db:
    image: postgres:17.9
    restart: unless-stopped
    environment:
      POSTGRES_DB: cours_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cours_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/amenallahbensalem/cours-api:v1.0.1
    restart: unless-stopped
    ports:
      - "8083:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cours_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET requis}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_test_data:
