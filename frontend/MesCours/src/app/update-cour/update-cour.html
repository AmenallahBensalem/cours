<div class="container">
  <div>
    <h2>Modifier un Cours :</h2>
  </div>

  <form>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Code Cours</label>
      <input readonly type="text" [(ngModel)]="currentCours.codeCour"
             name="codeCour" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Intitulé</label>
      <input type="text" [(ngModel)]="currentCours.intituleCour"
             name="intituleCour" class="form-control">
    </div>

    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Durée totale (h)</label>
      <input type="number" [(ngModel)]="currentCours.dureeTotale"
             name="dureeTotale" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Date de mise à jour</label>
      <input type="date"
             [ngModel]="currentCours.dateMiseAJour | date:'yyyy-MM-dd'"
             (ngModelChange)="currentCours.dateMiseAJour = $event"
             name="dateMiseAJour" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Professeur</label>
      <select class="form-control" id="idProf" name="idProf" [(ngModel)]="updatedProfId">
        @for (p of professeurs; track p.codeProf) {
          <option [ngValue]="p.codeProf">{{ p.nomProf }} ({{ p.specialiteProf }})</option>
        }
      </select>
    </div>

    <div class="mt-2">
      <button type="submit" (click)="updateCours()" class="btn btn-success">Modifier</button>
    </div>
  </form>
</div>
